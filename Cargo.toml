[workspace]
members = [
    "crates/tak-context",
    "crates/tak-entropy",
    "crates/tak-codecs",
    "crates/tak-tensor",
    "crates/tak-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/403-html/tak"
authors = ['Tymoteusz "403-html" Stępień']
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

